[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Defaults (E4, E7, E9, F) plus style, imports, likely bugs, modern syntax and pytest.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PT", "RUF"]

[tool.mypy]
strict = true
files = ["."]
exclude = ["^\\.venv/"]
